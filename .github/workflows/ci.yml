name: CI & Release Build

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build, Test & Package Native Desktop Apps
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore OpenWindow.sln

    - name: Build Solution (Release)
      run: dotnet build OpenWindow.sln -c Release --no-restore

    - name: Run Unit & Integration Tests
      run: dotnet test OpenWindow.sln -c Release --no-build --verbosity normal

    - name: Package Standalone Native Releases (x64 and x86)
      shell: powershell
      run: |
        $ver = if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -match '^v?(.*)$') { $Matches[1] } else { "1.1.3" }
        Write-Host "Packaging OpenWindow release version $ver"
        .\package-release.ps1 -Version $ver

    - name: Upload Standalone Native Zip Packages
      uses: actions/upload-artifact@v4
      with:
        name: OpenWindow-Release-Packages
        path: dist/*.zip

    - name: Upload Checksums
      uses: actions/upload-artifact@v4
      with:
        name: checksums
        path: dist/checksums.txt
